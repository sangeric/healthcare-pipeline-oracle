services:
  oracle-hopa:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-hopa
    environment:
      ORACLE_PASSWORD: ${HOPA_SYS_PASSWORD:?voir .env.example}
      APP_USER: SRC_HOPA
      APP_USER_PASSWORD: ${HOPA_APP_PASSWORD:?voir .env.example}
    ports:
      - "1523:1521"
    volumes:
      - hopa-data:/opt/oracle/oradata
    networks:
      - oncology-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  oracle-hopb:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-hopb
    environment:
      ORACLE_PASSWORD: ${HOPB_SYS_PASSWORD:?voir .env.example}
      APP_USER: SRC_HOPB
      APP_USER_PASSWORD: ${HOPB_APP_PASSWORD:?voir .env.example}
    ports:
      - "1522:1521"
    volumes:
      - hopb-data:/opt/oracle/oradata
    networks:
      - oncology-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  hopa-data:
  hopb-data:

networks:
  oncology-net: